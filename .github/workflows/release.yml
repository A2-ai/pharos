name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build-Binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # GNU builds on AlmaLinux 8 (glibc 2.28)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: almalinux:8
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            container: almalinux:8

    steps:
      - name: Install dependencies (AlmaLinux)
        run: |
          dnf install -y gcc gcc-c++ make git curl tar gzip clang llvm
          # Install aarch64 cross-compilation toolchain
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            dnf install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Add Rust target
        run: |
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python (for version check)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          dnf install -y python3

      - name: Check version matches tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python3 .github/scripts/tag_check.py "${{ github.ref_name }}"

      - name: Cargo build
        run: |
          . "$HOME/.cargo/env"
          # Configure cross-compilation linker for aarch64
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --all --features=cli --release --target ${{ matrix.target }}

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/pharos artifacts/pharos-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/pharos-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Stage 2: Create GitHub Release with all artifacts
  Create-Release:
    needs: [Build-Binaries]
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "binary-*"
          path: ./release-assets
          merge-multiple: true

      - name: Create tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd release-assets

          # Create tarball for x86_64 (amd64)
          mkdir -p pharos_temp_x86_64
          cp pharos-x86_64-unknown-linux-gnu pharos_temp_x86_64/pharos
          chmod +x pharos_temp_x86_64/pharos
          tar -czf "pharos_${VERSION}_linux_amd64.tar.gz" -C pharos_temp_x86_64 pharos

          # Create tarball for aarch64 (arm64)
          mkdir -p pharos_temp_aarch64
          cp pharos-aarch64-unknown-linux-gnu pharos_temp_aarch64/pharos
          chmod +x pharos_temp_aarch64/pharos
          tar -czf "pharos_${VERSION}_linux_arm64.tar.gz" -C pharos_temp_aarch64 pharos

          # Clean up temp directories and raw binaries
          rm -rf pharos_temp_* pharos-*-unknown-linux-gnu

          # List final artifacts
          ls -lah

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Welcome to release ${{ github.ref_name }} of pharos!

            **Available packages:**
            - `pharos_${{ steps.version.outputs.version }}_linux_amd64.tar.gz` - Tarball for x86_64
            - `pharos_${{ steps.version.outputs.version }}_linux_arm64.tar.gz` - Tarball for ARM64

            **Installation (Generic Linux - tar.gz):**
            ```bash
            tar -xzf pharos_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            sudo mv pharos /usr/local/bin/
            ```

            **Build Information:**
            - Built on AlmaLinux 8 (glibc 2.28) for broad compatibility
            - Binaries are dynamically linked against glibc 2.28+

            **Verify Installation:**
            ```bash
            pharos --version
            ```

            **Checksums:**
            See `checksums.txt` for SHA256 checksums of all artifacts.
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-test') }}
          files: release-assets/*
