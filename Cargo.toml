[package]
name = "pharos"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "pharos"

[workspace]
members = ["components/*"]

[profile.dev]
# Disabling debug info speeds up builds a bunch,
# and we don't rely on it for debugging that much.
debug = 0

[dependencies]
config = { path = "components/config" }
nonmem = { path = "components/nonmem", features = ["cli"] }
scheduler = { path = "components/scheduler", features = ["cli"] }

anyhow = { workspace = true }
fs-err = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

[workspace.dependencies]
serde = { version = "1.0.0", features = ["derive"] }
toml = "0.9"
anyhow = "1"
fs-err = "3"
blake3 = "1.8.2"
tempfile = "3.20.0"
walkdir = "2"
glob = "0.3"
serde_json = "1"
regex = "1"
jiff = "0.2"
insta = { version = "1.43.1", features = ["yaml", "glob"] }
rand = { version = "0.9.2"}
which = "8.0"
rayon = "1"
num_cpus = "1.17.0"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
tera = "1"
signal-hook = "0.3"
distrs = "0.2"
nalgebra = "0.34.1"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
