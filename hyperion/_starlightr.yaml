# starlightr configuration file
# This file defines how your R package documentation will be built into a Starlight site

# Site metadata
site:
  title: "hyperion"
  description: "Hyperion is an R interface to the pharos CLI for"
  # logo: "man/figures/logo.png"       # Path to logo image (relative to package root)
  # favicon: "man/figures/favicon.png" # Path to favicon (can be same as logo)

# Home page configuration
home:
  hero:
    tagline: "Hyperion is an R interface to the pharos CLI for"
    actions:
      - text: "Get Started"
        link: "./articles/readme/"
        icon: "right-arrow"
        variant: "primary"
      - text: "View on GitHub"
        link: "https://github.com/user/repo"  # Update this!
        icon: "external"
        variant: "minimal"
  cards:
    - icon: document
      title: Model Interaction
      description: hyperion has several functions for interacting with NONMEM models
      link: ./reference/read_model/
    - icon: seti:csv
      title: Parameter Tables
      description: hyperion can create model parameter tables
      link: ./articles/parameter-tables/

# Sidebar configuration for different sections
sidebar:
  articles:
    # Custom organization of vignettes/articles
    - label: "Getting Started"
      contents:
        - "README"
    - label: "Output Files"
      contents:
        - "ext"
        - "grd"
        - "shk"
        - "lst"
    - label: "Model"
      contents:
        - "hyperion_model"
    - label: "Tables"
      contents:
        - "parameter-tables"

  reference:
    - label: "Models"
      contents:
        - "read_model"
        - "copy_model"
        - "check_model"
        - "get_model_lineage"
        - "get_model_summary"
        - "get_run_info"
    - label: "Parameters"
      contents:
        - "get_parameters"
        - "get_final_estimates"
        - "get_theta_names"
        - "get_eta_labels"
        - "get_model_parameter_info"
        - "get_model_parameter_names"
        - "get_parameter_names"
        - "get_parameter_transform"
        - "get_parameter_unit"
    - label: "Parameter Computations"
      contents:
        - "compute_ci"
        - "compute_cv"
        - "compute_rse"
        - "transform_value"
    - label: "Parameter Tables"
      contents:
        - "make_parameter_table"
        - "audit_parameter_info"
        - "TableSpec"
        - "apply_table_spec"
        - "get_table_spec"
        - "add_summary_info"
    - label: "Shrinkage & Gradients"
      contents:
        - "get_eps_shrinkage"
        - "get_eta_shrinkage"
        - "get_gradients"
    - label: "Comments"
      contents:
        - "ModelComments"
        - "ThetaComment"
        - "OmegaComment"
        - "SigmaComment"
        - "get_comment"
        - "get_comment_type"
    - label: "Lookup & Rules"
      contents:
        - "apply_lookup"
        - "apply_lookup_defaults"
        - "filter_rules"
        - "section_rules"
    - label: "Output Files"
      contents:
        - "read_ext_file"
    - label: "Data & Metadata"
      contents:
        - "check_dataset"
        - "set_metadata_file"
        - "update_metadata_file"
    - label: "Configuration & Submission"
      contents:
        - "init"
        - "get_pharos_config"
        - "submit_model_to_sge"
        - "submit_model_to_slurm"

  # Changelog from NEWS.md
# Theme and appearance
theme:
  color_mode: "auto"  # light, dark, or auto

# Content processing options
content:
  # Custom sections to format as code
  code_sections:
    - "usage"
    - "examples"

  # Sections to skip entirely
  skip_sections:
    - "author"

# Output directory for generated site
output:
  dir: "../Docs/hyperion-docs"  # External directory (recommended)
  # dir: "docs"       # Internal directory (not recommended due to bloat)
  include_build_files: true

versions:
  enabled: true
  list:
    - tag: "0.1.1"
      label: "v0.1.1"
      default: true
  workflow:
    generate: true
    node_version: "20"
 
