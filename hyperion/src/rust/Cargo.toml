[package]
name = 'hyperion'
publish = false
version = '0.1.0'
edition = '2024'

[lib]
crate-type = [ 'staticlib' ]
name = 'hyperion'
path = 'lib.rs'

[workspace]
members = ["nonmem", "scheduler", "core"]

[dependencies]
# Internal crates
hyperion-nonmem = { path = "nonmem" }
hyperion-scheduler = { path = "scheduler" }
hyperion-core = { path = "core" }

# R Integration
extendr-api = { workspace = true }

# Pharos components (for init module)
config = { workspace = true }

# Core utilities
toml = { workspace = true }
fs-err = { workspace = true }
serde = { workspace = true }

[workspace.dependencies]
# R Integration
extendr-api = { git = "https://github.com/extendr/extendr", branch = "main", features = ["serde"] }

# Pharos components
nonmem = { git = "https://github.com/a2-ai/pharos", package = "nonmem", branch = "metadata-from-model" }
config = { git = "https://github.com/a2-ai/pharos", package = "config", branch = "metadata-from-model" }
scheduler = { git = "https://github.com/a2-ai/pharos", package = "scheduler", branch = "metadata-from-model" }

# Core utilities
anyhow = "1.0.100"
fs-err = "3.1.2"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1"
toml = "0.9.7"

# Testing and utilities
insta = { version = "1.43.2", features = ['glob'] }
tempfile = "3.23.0"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = { workspace = true }
